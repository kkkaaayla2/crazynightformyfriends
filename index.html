<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A0E14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>疯狂星期X · CRAZY NIGHT</title>

  <!-- 西文字体：Fraunces 衬线 + Space Grotesk 无衬线 + JetBrains Mono 等宽 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <!-- 中文标题字体：得意黑 Smiley Sans Oblique（阿里开源，自带 3.5° 倾斜） -->
  <style>
    @font-face {
      font-family: 'Smiley Sans';
      font-style: oblique 3.5deg;
      font-weight: 400 900;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/gh/atelier-anchor/smiley-sans@latest/dist/SmileySans-Oblique.woff2') format('woff2');
    }
  </style>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <!-- 背景层：深酒红颗粒渐变 + SVG 噪点纹理 -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div class="bg-noise"></div>
    <div class="bg-vignette"></div>
  </div>

  <div id="app" class="app">

    <!-- ========== 顶部标题栏 ========== -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">疯</span>
        <div class="brand-text">
          <span class="brand-cn" id="brandCnText">疯狂星期天</span>
          <span class="brand-en">DRINKING GAMES</span>
        </div>
      </div>
      <div class="header-actions">
        <a class="header-add-btn" href="./submit.html" aria-label="加一张卡">
          <span class="add-btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </span>
          <span class="add-btn-text">加一张卡</span>
        </a>
      </div>
    </header>

    <!-- ========== 主内容区：4 个 Tab Section ========== -->
    <main class="app-main">

      <!-- Tab 1：抓手指 -->
      <section class="tab-pane is-active" data-pane="grab-finger">
        <div class="pane-inner">
          <div class="card-stage" data-stage="grab-finger">
            <!-- 票根卡片由 JS 渲染 -->
          </div>
          <div class="swipe-affordance" aria-hidden="true">
            <span class="arrow">‹</span>
            <span>SWIPE</span>
            <span class="arrow">›</span>
          </div>
          <button class="shuffle-btn" data-shuffle="grab-finger" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>换一张</span>
          </button>
        </div>
      </section>

      <!-- Tab 2：真心话 -->
      <section class="tab-pane" data-pane="truth">
        <div class="pane-inner">
          <!-- 模式切换器 -->
          <div class="mode-switcher" data-mode-switcher="truth" data-mode="kindergarten">
            <button class="mode-side mode-side-left is-active" data-mode-target="kindergarten" type="button">
              <span class="mode-emoji">🚌</span>
              <span class="mode-label">幼儿园</span>
            </button>
            <div class="mode-track">
              <div class="mode-road">
                <span class="road-dash"></span>
                <span class="road-dash"></span>
                <span class="road-dash"></span>
                <span class="road-dash"></span>
                <span class="road-dash"></span>
              </div>
              <div class="mode-vehicle">
                <!-- 校车 SVG -->
                <svg class="vehicle-bus" viewBox="0 0 64 36" width="56" height="32" aria-hidden="true">
                  <rect x="2" y="6" width="50" height="22" rx="4" fill="#E8A33D" />
                  <rect x="2" y="6" width="50" height="6" rx="3" fill="#C8861E" />
                  <rect x="6" y="14" width="8" height="8" fill="#6FE3C4" />
                  <rect x="18" y="14" width="8" height="8" fill="#6FE3C4" />
                  <rect x="30" y="14" width="8" height="8" fill="#6FE3C4" />
                  <rect x="42" y="14" width="8" height="8" fill="#6FE3C4" />
                  <rect x="52" y="16" width="6" height="10" rx="2" fill="#1A0E14" />
                  <circle cx="14" cy="30" r="4" fill="#1A0E14" />
                  <circle cx="14" cy="30" r="1.5" fill="#E8A33D" />
                  <circle cx="42" cy="30" r="4" fill="#1A0E14" />
                  <circle cx="42" cy="30" r="1.5" fill="#E8A33D" />
                </svg>
              </div>
            </div>
            <button class="mode-side mode-side-right" data-mode-target="highway" type="button">
              <span class="mode-emoji">🏁</span>
              <span class="mode-label">上高速</span>
            </button>
          </div>

          <div class="card-stage" data-stage="truth">
            <!-- 票根卡片由 JS 渲染 -->
          </div>
          <div class="swipe-affordance" aria-hidden="true">
            <span class="arrow">‹</span>
            <span>SWIPE</span>
            <span class="arrow">›</span>
          </div>
          <button class="shuffle-btn" data-shuffle="truth" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>换一张</span>
          </button>
        </div>
      </section>

      <!-- Tab 3：大冒险 -->
      <section class="tab-pane" data-pane="dare">
        <div class="pane-inner">
          <div class="mode-switcher" data-mode-switcher="dare" data-mode="kindergarten">
            <button class="mode-side mode-side-left is-active" data-mode-target="kindergarten" type="button">
              <span class="mode-emoji">🚌</span>
              <span class="mode-label">幼儿园</span>
            </button>
            <div class="mode-track">
              <div class="mode-road">
                <span class="road-dash"></span>
                <span class="road-dash"></span>
                <span class="road-dash"></span>
                <span class="road-dash"></span>
                <span class="road-dash"></span>
              </div>
              <div class="mode-vehicle">
                <svg class="vehicle-bus" viewBox="0 0 64 36" width="56" height="32" aria-hidden="true">
                  <rect x="2" y="6" width="50" height="22" rx="4" fill="#E8A33D" />
                  <rect x="2" y="6" width="50" height="6" rx="3" fill="#C8861E" />
                  <rect x="6" y="14" width="8" height="8" fill="#6FE3C4" />
                  <rect x="18" y="14" width="8" height="8" fill="#6FE3C4" />
                  <rect x="30" y="14" width="8" height="8" fill="#6FE3C4" />
                  <rect x="42" y="14" width="8" height="8" fill="#6FE3C4" />
                  <rect x="52" y="16" width="6" height="10" rx="2" fill="#1A0E14" />
                  <circle cx="14" cy="30" r="4" fill="#1A0E14" />
                  <circle cx="14" cy="30" r="1.5" fill="#E8A33D" />
                  <circle cx="42" cy="30" r="4" fill="#1A0E14" />
                  <circle cx="42" cy="30" r="1.5" fill="#E8A33D" />
                </svg>
              </div>
            </div>
            <button class="mode-side mode-side-right" data-mode-target="highway" type="button">
              <span class="mode-emoji">🏁</span>
              <span class="mode-label">上高速</span>
            </button>
          </div>

          <div class="card-stage" data-stage="dare">
            <!-- 票根卡片由 JS 渲染 -->
          </div>
          <div class="swipe-affordance" aria-hidden="true">
            <span class="arrow">‹</span>
            <span>SWIPE</span>
            <span class="arrow">›</span>
          </div>
          <button class="shuffle-btn" data-shuffle="dare" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>换一张</span>
          </button>
        </div>
      </section>

      <!-- Tab 4：其他游戏 -->
      <section class="tab-pane" data-pane="other-games">
        <div class="pane-inner">
          <div class="card-stage" data-stage="other-games">
            <!-- 票根卡片（卷轴样式）由 JS 渲染 -->
          </div>
          <div class="swipe-affordance" aria-hidden="true">
            <span class="arrow">‹</span>
            <span>SWIPE</span>
            <span class="arrow">›</span>
          </div>
          <button class="shuffle-btn" data-shuffle="other-games" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>换一个</span>
          </button>
        </div>
      </section>

    </main>

    <!-- ========== 底部 Tab 导航 ========== -->
    <nav class="tab-bar" role="tablist">
      <button class="tab-item is-active" data-tab="grab-finger" role="tab" aria-selected="true" type="button">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11V6a2 2 0 0 1 4 0v5"></path>
            <path d="M13 11V4a2 2 0 0 1 4 0v7"></path>
            <path d="M17 11V8a2 2 0 0 1 4 0v8a6 6 0 0 1-6 6h-2c-2.97 0-5.43-2.16-5.92-5l-2-7a2 2 0 0 1 3.79-1.21L9 11"></path>
          </svg>
        </span>
        <span class="tab-label">抓手指</span>
        <span class="tab-indicator" aria-hidden="true"></span>
      </button>

      <button class="tab-item" data-tab="truth" role="tab" aria-selected="false" type="button">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </span>
        <span class="tab-label">真心话</span>
        <span class="tab-indicator" aria-hidden="true"></span>
      </button>

      <button class="tab-item" data-tab="dare" role="tab" aria-selected="false" type="button">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </span>
        <span class="tab-label">大冒险</span>
        <span class="tab-indicator" aria-hidden="true"></span>
      </button>

      <button class="tab-item" data-tab="other-games" role="tab" aria-selected="false" type="button">
        <span class="tab-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"></circle>
            <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"></circle>
            <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"></circle>
            <circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"></circle>
            <circle cx="12" cy="12" r="1.3" fill="currentColor"></circle>
          </svg>
        </span>
        <span class="tab-label">玩点别的</span>
        <span class="tab-indicator" aria-hidden="true"></span>
      </button>
    </nav>

  </div>

  <script src="./main.js"></script>
</body>
</html>
